services:
  - type: web
    name: repopilot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REPOPILOT_SESSION_TTL_SECONDS
        value: "3600"
